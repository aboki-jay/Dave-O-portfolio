{{> site-header}}
  <main id="main" class="gate-wrapper">
    <div class="gate">
      <div class="gate__icon"><img src="/icons/icon-lock.svg" width="20" height="20" alt=""></div>
      <div class="gate__message">
        <h1 class="heading-4">This case study is under NDA</h1>
        <p class="body-16">The work is confidential. Enter the password to view it, or email me to request access.</p>
      </div>
      <!-- The password is checked on Cloudflare (see cloudflare-worker/confidential-project-lock.js), never in the browser. -->
      <form class="gate__form" method="post" action="/work/confidential-project/">
        <div class="field" data-gate-field>
          <label class="field__label" for="password">Password</label>
          <div class="field__control">
            <input id="password" name="password" type="password" placeholder="••••••••••••" autocomplete="off" required aria-describedby="password-error">
            <button class="field__toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle><img src="/icons/icon-eye.svg" width="20" height="20" alt=""></button>
          </div>
        </div>
        <p class="gate__error" id="password-error" role="alert" data-gate-error hidden>That password isn’t right. Try again or request access.</p>
        <div class="gate__actions">
          <button class="button button--primary button--full" type="submit"><span>View case study</span></button>
          <a class="button button--secondary button--full" href="mailto:{{email}}?subject=Access%20to%20your%20confidential%20case%20study"><img src="/icons/icon-mail.svg" width="20" height="20" alt=""><span>Request access</span></a>
        </div>
      </form>
    </div>
  </main>
  {{> site-footer}}
