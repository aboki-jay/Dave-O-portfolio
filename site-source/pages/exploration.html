{{> site-header}}
  <main id="main" class="exploration">
    <h1 class="heading-2">Exploration</h1>

    <!-- The explorations are added in Sanity (https://davidokunlola.sanity.studio, "Explorations").
         The build step writes one block per exploration here: a picture or video, its name and a line
         or two about it. On screen they become tiles on an endless board that visitors scroll or drag
         around ("Exploration page" in site.js); pointing at a tile shows its name, description and
         link. This list is what the board is made from, and what search engines, screen readers and
         browsers without scripts get. -->
    <div class="exploration-grid" data-exploration-list>
{{> exploration-tiles}}
    </div>
  </main>
