<header class="site-header">
    <a class="site-identity" href="/" aria-label="David Okunlola, home">
      <img class="site-identity__logo" src="/images/logo-david-okunlola-96.webp" srcset="/images/logo-david-okunlola-96.webp 2x, /images/logo-david-okunlola-144.webp 3x" width="48" height="48" alt="">
      <span>
        <span class="site-identity__name">David Okunlola</span>
        <span class="site-identity__role">Product &amp; Brand Designer</span>
      </span>
    </a>
    <!-- Phones: the speaker and menu buttons sit together on the right. -->
    <div class="site-header__actions">
      <button class="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off" data-sound-toggle>
        <img class="sound-toggle__on" src="/icons/icon-volume-on.svg" width="20" height="20" alt="">
        <img class="sound-toggle__off" src="/icons/icon-volume-off.svg" width="20" height="20" alt="">
      </button>
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav" data-menu-button>
        <img src="/icons/icon-menu.svg" width="20" height="20" alt="">
      </button>
    </div>
    <!-- Phones: the menu is a sheet that slides up from the bottom, over a blurred copy of the page.
         On tablets and computers the same links sit in a row in the header, and the sheet's extra
         pieces (backdrop, handle, close button) are hidden. -->
    <div class="nav-backdrop" data-menu-backdrop></div>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <div class="nav-sheet__handle" data-menu-handle><span></span></div>
      <div class="nav-sheet__top">
        <button class="nav-sheet__close" type="button" aria-label="Close menu" data-menu-close><img src="/icons/icon-x-16.svg" width="16" height="16" alt=""></button>
      </div>
      <div class="nav-sheet__links">
      {{navLinks}}
      <!-- Desktop: the speaker button sits between the links and Contact. -->
      <button class="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off" data-sound-toggle>
        <img class="sound-toggle__on" src="/icons/icon-volume-on.svg" width="20" height="20" alt="">
        <img class="sound-toggle__off" src="/icons/icon-volume-off.svg" width="20" height="20" alt="">
      </button>
      <a class="button button--primary button--small" href="{{contactHref}}"><span>Contact</span></a>
      </div>
      <!-- Phones only: tapping Work in the sheet shows the projects here, one at a time, instead of
           leaving the page. The projects are written in by build-website.js ("sheetWorkProjects"). -->
      <div class="nav-sheet__work" data-sheet-work-view>
        {{workSheet}}
      </div>
    </nav>
  </header>
