<!-- Connect: the contact paragraph shown near the bottom of most pages. The wording and links
       come from content/site-details.json (contactLine, email, linkedinUrl, xUrl). -->
  <section class="contact-section" id="contact" aria-labelledby="contact-heading">
    <h2 class="connect__label" id="contact-heading">Connect</h2>
    <p class="connect__text">Have a product or brand to design? {{contactLine}} Reach me at <a href="mailto:{{email}}">{{email}}</a>, or find me on <a href="{{linkedinUrl}}" target="_blank" rel="noopener">LinkedIn</a> and <a href="{{xUrl}}" target="_blank" rel="noopener">X</a>.</p>
  </section>
