<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  {{robots}}
  <link rel="canonical" href="{{canonical}}">

  <!-- Preview shown when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ownerName}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{address}}/images/link-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ownerName}}: I design fintech and SaaS products from 0 to 1, and the brands around them.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <link rel="preload" href="/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/site.css">
  <script src="/scripts/site.js" defer></script>
  <script type="module" src="/scripts/site-sounds.js"></script>
  {{analytics}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
  {{content}}
  </div>
</body>
</html>
